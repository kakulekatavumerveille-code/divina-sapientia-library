<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bibliothèque Divina Sapientia</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#172033;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
    background:#172b4d;
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:5px;
}

.subtitle{
    font-size:13px;
    opacity:.85;
}


/* =========================================================
   RECHERCHE
========================================================= */

.search-area{
    max-width:1200px;
    margin:16px auto 10px;
    padding:0 12px;
}

.search-box{
    display:flex;
    align-items:center;
    background:white;
    border-radius:12px;
    border:1px solid #dce2ea;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.search-icon{
    padding:0 12px;
    font-size:20px;
}

#search{
    flex:1;
    border:0;
    outline:0;
    padding:14px 8px;
    font-size:16px;
    background:white;
}


/* =========================================================
   OUTILS
========================================================= */

.tools{
    max-width:1200px;
    margin:0 auto;
    padding:0 12px 12px;

    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.tool{
    background:white;
    border:1px solid #dce2ea;
    border-radius:9px;
    padding:9px 12px;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
}

.tool:hover{
    background:#eef3fa;
}

.tool.active{
    background:#172b4d;
    color:white;
    border-color:#172b4d;
}


/* =========================================================
   INFORMATIONS
========================================================= */

#resultInfo{
    max-width:1200px;
    margin:auto;
    padding:0 12px 8px;
    font-size:13px;
    color:#657084;
}


/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb{
    max-width:1200px;
    margin:auto;
    padding:10px 12px;

    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;

    font-size:14px;
}

.breadcrumb button{
    border:0;
    background:none;
    color:#1769aa;
    cursor:pointer;
    padding:3px;
    font-size:14px;
}

.breadcrumb span{
    color:#8791a2;
}


/* =========================================================
   CONTENU
========================================================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:0 12px 40px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin:8px 0 12px;
}


/* =========================================================
   MODE GRILLE
========================================================= */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
}


/* =========================================================
   CARTE GRILLE
========================================================= */

.card{
    background:white;
    border:1px solid #e0e5ec;
    border-radius:13px;
    padding:15px;

    min-height:125px;

    cursor:pointer;

    transition:
        transform .15s,
        box-shadow .15s,
        border-color .15s;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    overflow:hidden;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    border-color:#b8c7db;
}

.icon{
    font-size:42px;
    margin-bottom:9px;
}

.card-name{
    font-size:14px;
    font-weight:600;
    word-break:break-word;
}

.card-info{
    margin-top:6px;
    font-size:11px;
    color:#7c8797;
}


/* =========================================================
   DOSSIER
========================================================= */

.folder .icon{
    font-size:44px;
}


/* =========================================================
   MODE LISTE
========================================================= */

.grid.list-view{
    display:flex;
    flex-direction:column;
    gap:7px;
}


/* =========================================================
   CARTE EN MODE LISTE
========================================================= */

.grid.list-view .card{

    width:100%;
    min-height:64px;

    padding:9px 12px;

    border-radius:10px;

    display:grid;

    grid-template-columns:48px minmax(0,1fr) auto;

    align-items:center;

    text-align:left;

    gap:10px;

    transform:none;
}


.grid.list-view .card:hover{
    transform:none;
}


.grid.list-view .icon{

    font-size:30px;

    margin:0;

    text-align:center;

}


.grid.list-view .card-name{

    font-size:14px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


.grid.list-view .card-info{

    margin:0;

    font-size:12px;

    color:#7c8797;

    text-align:right;

    white-space:nowrap;

}


/* =========================================================
   RECHERCHE EN LISTE
========================================================= */

.grid.list-view .folder .card-info{

    display:block;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;
    padding:50px 15px;
    color:#7c8797;
}


/* =========================================================
   VIEWER PLEIN ÉCRAN
========================================================= */

#viewer{

    position:fixed;

    inset:0;

    background:#11151c;

    z-index:1000;

    display:none;

    flex-direction:column;

}

#viewer.active{
    display:flex;
}


/* =========================================================
   HEADER VIEWER
========================================================= */

.viewer-header{

    height:58px;

    flex-shrink:0;

    background:#171c25;

    color:white;

    display:flex;

    align-items:center;

    padding:0 10px;

    gap:8px;

}

.viewer-title{

    flex:1;

    min-width:0;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    font-size:14px;

}

.viewer-btn{

    border:0;

    background:#2a313d;

    color:white;

    min-width:40px;

    height:40px;

    border-radius:8px;

    font-size:20px;

    cursor:pointer;

}

.viewer-btn:hover{
    background:#394251;
}


/* =========================================================
   CORPS VIEWER
========================================================= */

.viewer-body{

    flex:1;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================================================
   IMAGE
========================================================= */

#imageViewer{

    max-width:100%;

    max-height:100%;

    object-fit:contain;

    user-select:none;

    -webkit-user-drag:none;

    transform-origin:center center;

    touch-action:none;

    cursor:grab;

}

#imageViewer.dragging{
    cursor:grabbing;
}


/* =========================================================
   AUDIO
========================================================= */

#audioViewer{

    width:min(700px,90%);

}


/* =========================================================
   VIDEO
========================================================= */

#videoViewer{

    max-width:100%;

    max-height:100%;

    width:auto;

    height:auto;

    outline:none;

}


/* =========================================================
   PDF
========================================================= */

#pdfArea{

    position:absolute;

    inset:0;

    overflow:auto;

    display:none;

    touch-action:none;

    background:#525252;

}

#pdfCanvas{

    display:block;

    margin:20px auto;

    background:white;

    box-shadow:0 3px 15px rgba(0,0,0,.4);

    transform-origin:top center;

}

.pdf-message{

    color:white;

    text-align:center;

    padding:40px;

}


/* =========================================================
   CONTRÔLES PDF
========================================================= */

.pdf-controls{

    position:absolute;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    display:flex;

    align-items:center;

    gap:6px;

    background:rgba(20,25,32,.92);

    padding:7px;

    border-radius:12px;

    z-index:10;

}

.pdf-controls button{

    width:38px;

    height:38px;

    border:0;

    border-radius:7px;

    background:#343c49;

    color:white;

    font-size:18px;

    cursor:pointer;

}

.pdf-page{

    color:white;

    font-size:13px;

    padding:0 6px;

    white-space:nowrap;

}


/* =========================================================
   CHARGEMENT
========================================================= */

.loading{

    color:white;

    font-size:15px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:14px 12px;
    }

    .title{
        font-size:20px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .card{
        min-height:115px;
        padding:11px;
    }

    .icon{
        font-size:36px;
    }

    .card-name{
        font-size:13px;
    }

    .tools{
        overflow-x:auto;
        flex-wrap:nowrap;
        padding-bottom:9px;
    }

    .tool{
        flex-shrink:0;
    }

    .pdf-controls{
        bottom:8px;
    }

    .grid.list-view .card{
        grid-template-columns:42px minmax(0,1fr) auto;
        min-height:60px;
        padding:8px;
    }

    .grid.list-view .icon{
        font-size:27px;
    }

    .grid.list-view .card-name{
        font-size:13px;
    }

    .grid.list-view .card-info{
        font-size:11px;
    }

}


/* =========================================================
   TRÈS PETITS ÉCRANS
========================================================= */

@media(max-width:380px){

    .grid.list-view .card-info{
        display:none;
    }

    .grid.list-view .card{
        grid-template-columns:40px minmax(0,1fr);
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header-inner">

        <div class="title">
            📚 Bibliothèque Divina Sapientia
        </div>

        <div class="subtitle">
            Partitions, documents, images, audios et vidéos
        </div>

    </div>

</header>


<!-- =======================================================
     RECHERCHE
======================================================= -->

<div class="search-area">

    <div class="search-box">

        <div class="search-icon">
            🔎
        </div>

        <input
            id="search"
            type="search"
            placeholder="Rechercher dans toute la bibliothèque..."
            autocomplete="off"
        >

    </div>

</div>


<!-- =======================================================
     OUTILS
======================================================= -->

<div class="tools">

    <!-- TRI -->

    <button
        class="tool"
        onclick="setSort('nameAsc')">

        🔤 A → Z

    </button>


    <button
        class="tool"
        onclick="setSort('nameDesc')">

        🔤 Z → A

    </button>


    <button
        class="tool"
        onclick="setSort('sizeAsc')">

        📦 Petite → Grande

    </button>


    <button
        class="tool"
        onclick="setSort('sizeDesc')">

        📦 Grande → Petite

    </button>


    <!-- AFFICHAGE -->

    <button
        id="gridButton"
        class="tool active"
        onclick="setView('grid')">

        ▦ Carrés

    </button>


    <button
        id="listButton"
        class="tool"
        onclick="setView('list')">

        ☰ Liste

    </button>


    <!-- ACTUALISATION -->

    <button
        class="tool"
        onclick="refreshLibrary()">

        🔄 Actualiser

    </button>

</div>


<!-- =======================================================
     INFORMATIONS
======================================================= -->

<div id="resultInfo"></div>


<!-- =======================================================
     BREADCRUMB
======================================================= -->

<div
    id="breadcrumb"
    class="breadcrumb">
</div>


<!-- =======================================================
     CONTENU
======================================================= -->

<main class="container">

    <div
        class="section-title"
        id="sectionTitle">

        Bibliothèque

    </div>


    <div
        id="grid"
        class="grid">

    </div>

</main>


<!-- =======================================================
     VIEWER
======================================================= -->

<div
    id="viewer">


    <!-- HEADER VIEWER -->

    <div class="viewer-header">


        <button
            class="viewer-btn"
            onclick="closeViewer()"
            title="Fermer">

            ✕

        </button>


        <div
            id="viewerTitle"
            class="viewer-title">
        </div>


        <button
            id="viewerZoomOut"
            class="viewer-btn"
            onclick="zoomOut()"
            title="Zoom arrière">

            −

        </button>


        <button
            id="viewerZoomIn"
            class="viewer-btn"
            onclick="zoomIn()"
            title="Zoom">

            +

        </button>


    </div>


    <!-- CORPS -->

    <div class="viewer-body">


        <div
            id="loading"
            class="loading">

            Chargement...

        </div>


        <!-- IMAGE -->

        <img
            id="imageViewer"
            style="display:none"
            draggable="false"
            alt="">


        <!-- AUDIO -->

        <audio
            id="audioViewer"
            controls
            controlsList="nodownload"
            style="display:none">
        </audio>


        <!-- VIDEO -->

        <video
            id="videoViewer"
            controls
            controlsList="nodownload noplaybackrate"
            disablePictureInPicture
            playsinline
            style="display:none">
        </video>


        <!-- PDF -->

        <div
            id="pdfArea">


            <canvas
                id="pdfCanvas">
            </canvas>


            <div class="pdf-controls">


                <button
                    onclick="previousPage()">

                    ‹

                </button>


                <div
                    id="pdfPage"
                    class="pdf-page">

                    1 / 1

                </div>


                <button
                    onclick="nextPage()">

                    ›

                </button>


                <button
                    onclick="zoomOut()">

                    −

                </button>


                <button
                    onclick="zoomIn()">

                    +

                </button>


                <button
                    onclick="fitPDF()">

                    ↔

                </button>


            </div>


        </div>


    </div>


</div>



<script type="module">


/* =========================================================
   PDF.JS
========================================================= */

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



/* =========================================================
   CONFIGURATION
========================================================= */

const JSON_URL =
    "bibliotheque.json";


const R2_BASE =
    "https://pub-03b759d4e4db40a1a34ad5132b30b4ed.r2.dev/";



/* =========================================================
   VARIABLES
========================================================= */

let library = {

    folders: [],

    files: []

};


let currentFolder = "";


let sortMode =
    localStorage.getItem(
        "divinaSort"
    ) || "nameAsc";


let viewMode =
    localStorage.getItem(
        "divinaView"
    ) || "grid";


let currentPDF = null;


let currentPage = 1;


let pdfScale = 1;



/* =========================================================
   ÉLÉMENTS
========================================================= */

const grid =
    document.getElementById(
        "grid"
    );


const search =
    document.getElementById(
        "search"
    );


const breadcrumb =
    document.getElementById(
        "breadcrumb"
    );


const sectionTitle =
    document.getElementById(
        "sectionTitle"
    );


const resultInfo =
    document.getElementById(
        "resultInfo"
    );


const viewer =
    document.getElementById(
        "viewer"
    );


const viewerTitle =
    document.getElementById(
        "viewerTitle"
    );


const loading =
    document.getElementById(
        "loading"
    );


const imageViewer =
    document.getElementById(
        "imageViewer"
    );


const audioViewer =
    document.getElementById(
        "audioViewer"
    );


const videoViewer =
    document.getElementById(
        "videoViewer"
    );


const pdfArea =
    document.getElementById(
        "pdfArea"
    );


const pdfCanvas =
    document.getElementById(
        "pdfCanvas"
    );


const pdfPage =
    document.getElementById(
        "pdfPage"
    );


const gridButton =
    document.getElementById(
        "gridButton"
    );


const listButton =
    document.getElementById(
        "listButton"
    );



/* =========================================================
   MODE D'AFFICHAGE
========================================================= */

window.setView =
function(mode){

    viewMode = mode;


    localStorage.setItem(
        "divinaView",
        mode
    );


    updateViewButtons();


    render();

};



function updateViewButtons(){

    if(viewMode === "grid"){

        gridButton.classList.add(
            "active"
        );

        listButton.classList.remove(
            "active"
        );

    }else{

        gridButton.classList.remove(
            "active"
        );

        listButton.classList.add(
            "active"
        );

    }

}



/* =========================================================
   CHARGER LA BIBLIOTHÈQUE
========================================================= */

async function loadLibrary(){

    try{

        const response =
            await fetch(
                JSON_URL +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Impossible de charger bibliotheque.json"
            );

        }


        library =
            await response.json();


        updateViewButtons();


        render();


    }catch(error){

        console.error(error);


        grid.innerHTML = `

            <div class="empty">

                ❌ Impossible de charger
                la bibliothèque.

            </div>

        `;

    }

}



/* =========================================================
   URL R2
========================================================= */

function getURL(key){

    return R2_BASE +

        key
        .split("/")
        .map(
            part =>
                encodeURIComponent(part)
        )
        .join("/");

}



/* =========================================================
   FORMAT TAILLE
========================================================= */

function formatSize(bytes){

    if(bytes < 1024)

        return bytes + " o";


    if(bytes < 1024 * 1024)

        return (
            bytes / 1024
        ).toFixed(1) + " Ko";


    if(bytes < 1024 * 1024 * 1024)

        return (
            bytes /
            1024 /
            1024
        ).toFixed(1) + " Mo";


    return (
        bytes /
        1024 /
        1024 /
        1024
    ).toFixed(2) + " Go";

}



/* =========================================================
   ICÔNES
========================================================= */

function getIcon(type){

    switch(type){

        case "pdf":
            return "📕";

        case "image":
            return "🖼️";

        case "audio":
            return "🎵";

        case "video":
            return "🎬";

        case "document":
            return "📄";

        case "spreadsheet":
            return "📊";

        case "presentation":
            return "📽️";

        case "archive":
            return "🗜️";

        default:
            return "📎";

    }

}



/* =========================================================
   TRI
========================================================= */

window.setSort =
function(mode){

    sortMode = mode;


    localStorage.setItem(
        "divinaSort",
        mode
    );


    render();

};



/* =========================================================
   COMPARATEUR
========================================================= */

function compareItems(a,b){

    if(
        sortMode ===
        "nameAsc"
    ){

        return a.name.localeCompare(
            b.name,
            "fr",
            {
                sensitivity:"base",
                numeric:true
            }
        );

    }


    if(
        sortMode ===
        "nameDesc"
    ){

        return b.name.localeCompare(
            a.name,
            "fr",
            {
                sensitivity:"base",
                numeric:true
            }
        );

    }


    if(
        sortMode ===
        "sizeAsc"
    ){

        return (
            a.size || 0
        ) -
        (
            b.size || 0
        );

    }


    if(
        sortMode ===
        "sizeDesc"
    ){

        return (
            b.size || 0
        ) -
        (
            a.size || 0
        );

    }


    return 0;

}



/* =========================================================
   RECHERCHE GLOBALE
========================================================= */

function globalSearch(term){

    term =
        term
        .trim()
        .toLowerCase();


    if(!term)

        return null;


    const files =
        library.files.filter(
            file => {

                const text = (

                    file.name +
                    " " +
                    file.key +
                    " " +
                    file.folder +
                    " " +
                    file.type +
                    " " +
                    file.extension

                ).toLowerCase();


                return text.includes(
                    term
                );

            }
        );


    const folders =
        library.folders.filter(
            folder =>

                folder
                .toLowerCase()
                .includes(term)
        );


    return {

        files,

        folders

    };

}



/* =========================================================
   AFFICHAGE PRINCIPAL
========================================================= */

function render(){

    const term =
        search.value.trim();


    /* RECHERCHE */

    if(term){

        renderGlobalSearch(
            term
        );

        return;

    }


    renderBreadcrumb();


    const folders =
        getCurrentFolders();


    const files =
        getCurrentFiles();


    const sortedFolders =
        [...folders].sort(
            (a,b) =>
                compareItems(
                    {
                        name:
                            getFolderName(a),
                        size:0
                    },
                    {
                        name:
                            getFolderName(b),
                        size:0
                    }
                )
        );


    const sortedFiles =
        [...files].sort(
            compareItems
        );


    grid.innerHTML =
        "";


    grid.classList.toggle(
        "list-view",
        viewMode === "list"
    );


    /* DOSSIERS */

    sortedFolders.forEach(
        folder => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card folder";


            card.innerHTML = `

                <div class="icon">
                    📁
                </div>

                <div class="card-name">

                    ${escapeHTML(
                        getFolderName(
                            folder
                        )
                    )}

                </div>

                <div class="card-info">

                    Dossier

                </div>

            `;


            card.onclick =
                () => {

                    currentFolder =
                        folder;

                    render();

                };


            grid.appendChild(
                card
            );

        }
    );


    /* FICHIERS */

    sortedFiles.forEach(
        file => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <div class="icon">

                    ${getIcon(
                        file.type
                    )}

                </div>


                <div class="card-name">

                    ${escapeHTML(
                        file.name
                    )}

                </div>


                <div class="card-info">

                    ${formatSize(
                        file.size
                    )}

                </div>

            `;


            card.onclick =
                () => {

                    openViewer(
                        file
                    );

                };


            grid.appendChild(
                card
            );

        }
    );


    if(
        sortedFolders.length === 0 &&
        sortedFiles.length === 0
    ){

        grid.innerHTML = `

            <div class="empty">

                📂 Ce dossier est vide.

            </div>

        `;

    }


    sectionTitle.textContent =

        currentFolder
        ?
        getFolderName(
            currentFolder
        )
        :
        "Bibliothèque";


    resultInfo.textContent =

        `${sortedFolders.length}
        dossier(s) •
        ${sortedFiles.length}
        fichier(s)`;

}



/* =========================================================
   RECHERCHE
========================================================= */

function renderGlobalSearch(
    term
){

    const results =
        globalSearch(
            term
        );


    breadcrumb.innerHTML = `

        <button
            onclick="goHome()">

            🏠 Bibliothèque

        </button>

        <span>›</span>

        <strong>
            Recherche
        </strong>

    `;


    sectionTitle.textContent =

        `Résultats pour « ${term} »`;


    grid.innerHTML =
        "";


    grid.classList.toggle(
        "list-view",
        viewMode === "list"
    );


    /* DOSSIERS */

    results.folders
        .sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    "fr",
                    {
                        sensitivity:"base"
                    }
                )
        )
        .forEach(
            folder => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card folder";


                card.innerHTML = `

                    <div class="icon">
                        📁
                    </div>

                    <div class="card-name">

                        ${escapeHTML(
                            getFolderName(
                                folder
                            )
                        )}

                    </div>

                    <div class="card-info">

                        ${escapeHTML(
                            folder
                        )}

                    </div>

                `;


                card.onclick =
                    () => {

                        search.value =
                            "";

                        currentFolder =
                            folder;

                        render();

                    };


                grid.appendChild(
                    card
                );

            }
        );


    /* FICHIERS */

    results.files
        .sort(
            compareItems
        )
        .forEach(
            file => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "card";


                card.innerHTML = `

                    <div class="icon">

                        ${getIcon(
                            file.type
                        )}

                    </div>


                    <div class="card-name">

                        ${escapeHTML(
                            file.name
                        )}

                    </div>


                    <div class="card-info">

                        📁
                        ${escapeHTML(
                            file.folder ||

                        )}

                            file.size
                        )}

                    </div>

                `;


                card.onclick =
                    () => {

                        openViewer(

                        );

                    };


                grid.appendChild(
                    card

            }
        );


    resultInfo.textContent =

        `${results.files.length}
        fichier(s) trouvé(s) •
        ${results.folders.length}
        dossier(s) trouvé(s)`;


    if(
        results.files.length === 0 &&
        results.folders.length === 0
    ){

        grid.innerHTML = `

            <div class="empty">

                🔎 Aucun résultat pour
                « ${escapeHTML(term)} »

            </div>

        `;

    }

}



/* =========================================================
   DOSSIERS DU NIVEAU ACTUEL
========================================================= */

function getCurrentFolders(){

    const prefix =

        currentFolder
        ?
        currentFolder + "/"
        :
        "";


    const folders = [];


    for(
        const folder of
        library.folders
    ){

        if(
            !folder.startsWith(
                prefix
            )
        )

            continue;


        const rest =
            folder.slice(
                prefix.length
            );


        if(
            rest &&
            !rest.includes("/")
        ){

            folders.push(
                folder
            );

        }

    }


    return folders;

}



/* =========================================================
   FICHIERS DU NIVEAU ACTUEL
========================================================= */

function getCurrentFiles(){

    return library.files.filter(
        file =>

            (
                file.folder || ""
            ) ===
            currentFolder
    );

}



/* =========================================================
   NOM DOSSIER
========================================================= */

function getFolderName(
    path
){

    return path
        .split("/")
        .pop();

}



/* =========================================================
   BREADCRUMB
========================================================= */

function renderBreadcrumb(){

    breadcrumb.innerHTML =
        "";


    const home =
        document.createElement(
            "button"
        );


    home.textContent =
        "🏠 Bibliothèque";


    home.onclick =
        () => {

            currentFolder =
                "";

            render();

        };


    breadcrumb.appendChild(
        home
    );


    if(!currentFolder)

        return;


    const parts =
        currentFolder.split(
            "/"
        );


    let path = "";


    parts.forEach(
        (
            part,
            index
        ) => {

            const separator =
                document.createElement(
                    "span"
                );


            separator.textContent =
                "›";


            breadcrumb.appendChild(
                separator
            );


            path =

                path
                ?
                path + "/" + part
                :
                part;


            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                part;


            const target =
                path;


            button.onclick =
                () => {

                    currentFolder =
                        target;

                    render();

                };


            breadcrumb.appendChild(
                button
            );

        }
    );

}



/* =========================================================
   PROTECTION HTML
========================================================= */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =========================================================
   OUVRIR UN FICHIER
========================================================= */

async function openViewer(
    file
){

    viewer.classList.add(
        "active"
    );


    viewerTitle.textContent =
        file.name;


    resetViewer();


    loading.style.display =
        "block";


    const url =
        getURL(
            file.key
        );


    try{


        /* IMAGE */

        if(
            file.type ===
            "image"
        ){

            imageViewer.src =
                url;


            imageViewer.style.display =
                "block";


            loading.style.display =
                "none";


            resetImageZoom();


            return;

        }


        /* AUDIO */

        if(
            file.type ===
            "audio"
        ){

            audioViewer.src =
                url;


            audioViewer.style.display =
                "block";


            loading.style.display =
                "none";


            audioViewer.load();


            return;

        }


        /* VIDEO */

        if(
            file.type ===
            "video"
        ){

            videoViewer.src =
                url;


            videoViewer.style.display =
                "block";


            loading.style.display =
                "none";


            videoViewer.load();


            return;

        }


        /* PDF */

        if(
            file.type ===
            "pdf"
        ){

            await openPDF(
                url
            );


            return;

        }


        /* AUTRES */

        loading.innerHTML = `

            Ce type de fichier
            ne possède pas encore
            de lecteur intégré.

        `;

    }


    catch(error){

        console.error(
            error
        );


        loading.innerHTML = `

            ❌ Impossible
            d'afficher ce fichier.

        `;

    }

}



/* =========================================================
   RESET VIEWER
========================================================= */

function resetViewer(){

    loading.innerHTML =
        "Chargement...";


    loading.style.display =
        "block";


    imageViewer.style.display =
        "none";


    audioViewer.style.display =
        "none";


    videoViewer.style.display =
        "none";


    pdfArea.style.display =
        "none";


    imageViewer.src =
        "";


    audioViewer.pause();


    audioViewer.removeAttribute(
        "src"
    );


    videoViewer.pause();


    videoViewer.removeAttribute(
        "src"
    );

}



/* =========================================================
   FERMER VIEWER
========================================================= */

window.closeViewer =
function(){

    viewer.classList.remove(
        "active"
    );


    resetViewer();


    currentPDF =
        null;

};



/* =========================================================
   OUVRIR PDF
========================================================= */

async function openPDF(
    url
){

    pdfArea.style.display =
        "block";


    loading.style.display =
        "block";


    try{

        currentPDF =
            await pdfjsLib
                .getDocument({
                    url:url
                })
                .promise;


        currentPage =
            1;


        pdfScale =
            1;


        loading.style.display =
            "none";


        await renderPDFPage();

    }


    catch(error){

        console.error(
            "Erreur PDF :",
            error
        );


        pdfArea.innerHTML = `

            <div class="pdf-message">

                ❌ Impossible
                d'afficher ce PDF.

                <br><br>

                Le lecteur PDF
                n'a pas pu charger
                le fichier.

            </div>

        `;

    }

}



/* =========================================================
   RENDRE PAGE PDF
========================================================= */

async function renderPDFPage(){

    if(!currentPDF)

        return;


    const page =
        await currentPDF.getPage(
            currentPage
        );


    const viewport =
        page.getViewport({
            scale:pdfScale
        });


    const dpr =
        window.devicePixelRatio ||
        1;


    pdfCanvas.width =
        viewport.width *
        dpr;


    pdfCanvas.height =
        viewport.height *
        dpr;


    pdfCanvas.style.width =
        viewport.width +
        "px";


    pdfCanvas.style.height =
        viewport.height +
        "px";


    const context =
        pdfCanvas.getContext(
            "2d"
        );


    const renderContext = {

        canvasContext:
            context,

        viewport:
            viewport,

        transform:[
            dpr,
            0,
            0,
            dpr,
            0,
            0
        ]

    };


    await page.render(
        renderContext
    ).promise;


    pdfPage.textContent =

        `${currentPage}
        / ${currentPDF.numPages}`;

}



/* =========================================================
   PAGE PRÉCÉDENTE
========================================================= */

window.previousPage =
async function(){

    if(
        !currentPDF ||
        currentPage <= 1
    )

        return;


    currentPage--;


    await renderPDFPage();

};



/* =========================================================
   PAGE SUIVANTE
========================================================= */

window.nextPage =
async function(){

    if(
        !currentPDF ||
        currentPage >=
        currentPDF.numPages
    )

        return;


    currentPage++;


    await renderPDFPage();

};



/* =========================================================
   ZOOM
========================================================= */

window.zoomIn =
async function(){


    /* IMAGE */

    if(
        imageViewer.style.display !==
        "none"
    ){

        imageScale =
            Math.min(
                imageScale * 1.25,
                6
            );


        applyImageTransform();


        return;

    }


    /* PDF */

    if(
        pdfArea.style.display !==
        "none"
    ){

        pdfScale =
            Math.min(
                pdfScale * 1.25,
                5
            );


        await renderPDFPage();

    }

};



window.zoomOut =
async function(){


    /* IMAGE */

    if(
        imageViewer.style.display !==
        "none"
    ){

        imageScale =
            Math.max(
                imageScale / 1.25,
                0.5
            );


        applyImageTransform();


        return;

    }


    /* PDF */

    if(
        pdfArea.style.display !==
        "none"
    ){

        pdfScale =
            Math.max(
                pdfScale / 1.25,
                0.5
            );


        await renderPDFPage();

    }

};



/* =========================================================
   ADAPTER PDF À LA LARGEUR
========================================================= */

window.fitPDF =
async function(){

    if(!currentPDF)

        return;


    const page =
        await currentPDF.getPage(
            currentPage
        );


    const base =
        page.getViewport({
            scale:1
        });


    const availableWidth =
        pdfArea.clientWidth -
        30;


    pdfScale =
        availableWidth /
        base.width;


    pdfScale =
        Math.max(
            0.5,
            Math.min(
                pdfScale,
                5
            )
        );


    await renderPDFPage();

};



/* =========================================================
   ZOOM IMAGE
========================================================= */

let imageScale = 1;


let imageX = 0;


let imageY = 0;



function resetImageZoom(){

    imageScale =
        1;


    imageX =
        0;


    imageY =
        0;


    applyImageTransform();

}



function applyImageTransform(){

    imageViewer.style.transform =

        `translate(
            ${imageX}px,
            ${imageY}px
        )
        scale(
            ${imageScale}
        )`;

}



/* =========================================================
   GESTES IMAGE
========================================================= */

let imageTouchStartDistance =
    null;


let imageTouchStartScale =
    1;


let imageDragStartX =
    0;


let imageDragStartY =
    0;


let imageStartX =
    0;


let imageStartY =
    0;



imageViewer.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length === 2
        ){

            imageTouchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            imageTouchStartScale =
                imageScale;

        }


        else if(
            event.touches.length === 1 &&
            imageScale > 1
        ){

            imageDragStartX =
                event.touches[0]
                    .clientX;


            imageDragStartY =
                event.touches[0]
                    .clientY;


            imageStartX =
                imageX;


            imageStartY =
                imageY;

        }

    },
    {
        passive:false
    }
);



imageViewer.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();


        /* PINCEMENT */

        if(
            event.touches.length === 2
        ){

            const distance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            if(
                imageTouchStartDistance
            ){

                const ratio =
                    distance /
                    imageTouchStartDistance;


                imageScale =
                    Math.max(
                        0.5,
                        Math.min(
                            imageTouchStartScale *
                            ratio,
                            6
                        )
                    );


                applyImageTransform();

            }


            return;

        }


        /* DÉPLACEMENT */

        if(
            event.touches.length === 1 &&
            imageScale > 1
        ){

            const dx =
                event.touches[0]
                    .clientX -
                imageDragStartX;


            const dy =
                event.touches[0]
                    .clientY -
                imageDragStartY;


            imageX =
                imageStartX +
                dx;


            imageY =
                imageStartY +
                dy;


            applyImageTransform();

        }

    },
    {
        passive:false
    }
);



imageViewer.addEventListener(
    "touchend",
    function(){

        imageTouchStartDistance =
            null;

    }
);



/* =========================================================
   GESTES PDF
========================================================= */

let pdfTouchStartDistance =
    null;


let pdfTouchStartScale =
    1;



pdfArea.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length === 2
        ){

            pdfTouchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pdfTouchStartScale =
                pdfScale;

        }

    },
    {
        passive:false
    }
);



pdfArea.addEventListener(
    "touchmove",
    function(event){

        if(
            event.touches.length !== 2
        )

            return;


        event.preventDefault();


        const distance =
            getTouchDistance(
                event.touches[0],
                event.touches[1]
            );


        if(
            pdfTouchStartDistance
        ){

            const ratio =
                distance /
                pdfTouchStartDistance;


            pdfScale =
                Math.max(
                    0.5,
                    Math.min(
                        pdfTouchStartScale *
                        ratio,
                        5
                    )
                );

        }

    },
    {
        passive:false
    }
);



pdfArea.addEventListener(
    "touchend",
    async function(){

        if(
            pdfTouchStartDistance
        ){

            pdfTouchStartDistance =
                null;


            await renderPDFPage();

        }

    }
);



/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
========================================================= */

function getTouchDistance(
    a,
    b
){

    const dx =
        a.clientX -
        b.clientX;


    const dy =
        a.clientY -
        b.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}
