<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bibliothèque Divina Sapientia</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f4f6f9;
    color:#172033;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   HEADER
========================================================= */

header{
    background:#172b4d;
    color:white;

    padding:18px 16px;

    position:sticky;
    top:0;

    z-index:50;

    box-shadow:
        0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:5px;
}

.subtitle{
    font-size:13px;
    opacity:.85;
}


/* =========================================================
   RECHERCHE
========================================================= */

.search-area{
    max-width:1200px;
    margin:16px auto 10px;
    padding:0 12px;
}

.search-box{
    display:flex;
    align-items:center;

    background:white;

    border-radius:12px;

    border:1px solid #dce2ea;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.05);
}

.search-icon{
    padding:0 12px;
    font-size:20px;
}

#search{
    flex:1;

    border:0;
    outline:0;

    padding:14px 8px;

    font-size:16px;

    background:white;
}


/* =========================================================
   OUTILS
========================================================= */

.tools{
    max-width:1200px;

    margin:0 auto;

    padding:0 12px 12px;

    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.tool{
    background:white;

    border:1px solid #dce2ea;

    border-radius:9px;

    padding:9px 12px;

    font-size:14px;

    cursor:pointer;

    white-space:nowrap;
}

.tool:hover{
    background:#eef3fa;
}

.tool.active{
    background:#172b4d;

    color:white;

    border-color:#172b4d;
}


/* =========================================================
   INFORMATIONS
========================================================= */

#resultInfo{

    max-width:1200px;

    margin:auto;

    padding:0 12px 8px;

    font-size:13px;

    color:#657084;
}


/* =========================================================
   FIL D'ARIANE
========================================================= */

.breadcrumb{

    max-width:1200px;

    margin:auto;

    padding:10px 12px;

    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;

    font-size:14px;
}

.breadcrumb button{

    border:0;

    background:none;

    color:#1769aa;

    cursor:pointer;

    padding:3px;

    font-size:14px;
}

.breadcrumb span{
    color:#8791a2;
}


/* =========================================================
   CONTENU
========================================================= */

.container{

    max-width:1200px;

    margin:auto;

    padding:0 12px 40px;
}

.section-title{

    font-size:18px;

    font-weight:bold;

    margin:8px 0 12px;
}


/* =========================================================
   GRILLE
========================================================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(160px,1fr)
        );

    gap:12px;
}


/* =========================================================
   CARTE
========================================================= */

.card{

    background:white;

    border:1px solid #e0e5ec;

    border-radius:13px;

    padding:15px;

    min-height:125px;

    cursor:pointer;

    transition:
        transform .15s,
        box-shadow .15s,
        border-color .15s;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    overflow:hidden;
}

.card:hover{

    transform:
        translateY(-2px);

    box-shadow:
        0 5px 18px rgba(0,0,0,.08);

    border-color:#b8c7db;
}

.icon{

    font-size:42px;

    margin-bottom:9px;
}

.card-name{

    font-size:14px;

    font-weight:600;

    word-break:break-word;
}

.card-info{

    margin-top:6px;

    font-size:11px;

    color:#7c8797;
}


/* =========================================================
   DOSSIER
========================================================= */

.folder .icon{
    font-size:44px;
}


/* =========================================================
   MODE LISTE
========================================================= */

.grid.list-view{

    display:flex;

    flex-direction:column;

    gap:7px;
}

.grid.list-view .card{

    width:100%;

    min-height:64px;

    padding:9px 12px;

    border-radius:10px;

    display:grid;

    grid-template-columns:
        48px
        minmax(0,1fr)
        auto;

    align-items:center;

    text-align:left;

    gap:10px;

    transform:none;
}

.grid.list-view .card:hover{
    transform:none;
}

.grid.list-view .icon{

    font-size:30px;

    margin:0;

    text-align:center;
}

.grid.list-view .card-name{

    font-size:14px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.grid.list-view .card-info{

    margin:0;

    font-size:12px;

    color:#7c8797;

    text-align:right;

    white-space:nowrap;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    text-align:center;

    padding:50px 15px;

    color:#7c8797;
}


/* =========================================================
   VIEWER GLOBAL
========================================================= */

#viewer{

    position:fixed;

    inset:0;

    background:#11151c;

    z-index:1000;

    display:none;

    flex-direction:column;
}

#viewer.active{
    display:flex;
}


/* =========================================================
   HEADER VIEWER
========================================================= */

.viewer-header{

    height:58px;

    flex-shrink:0;

    background:#171c25;

    color:white;

    display:flex;

    align-items:center;

    padding:0 10px;

    gap:8px;

    z-index:30;
}

.viewer-title{

    flex:1;

    min-width:0;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    font-size:14px;
}

.viewer-btn{

    border:0;

    background:#2a313d;

    color:white;

    min-width:40px;

    height:40px;

    border-radius:8px;

    font-size:20px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;
}

.viewer-btn:hover{
    background:#394251;
}


/* =========================================================
   CORPS VIEWER
========================================================= */

.viewer-body{

    flex:1;

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   IMAGE
========================================================= */

#imageViewer{

    max-width:100%;

    max-height:100%;

    object-fit:contain;

    user-select:none;

    -webkit-user-drag:none;

    transform-origin:center center;

    touch-action:none;

    cursor:grab;
}

#imageViewer.dragging{
    cursor:grabbing;
}


/* =========================================================
   AUDIO
========================================================= */

#audioViewer{

    width:min(
        700px,
        90%
    );
}


/* =========================================================
   VIDEO
========================================================= */

#videoViewer{

    max-width:100%;

    max-height:100%;

    width:auto;

    height:auto;

    outline:none;
}


/* =========================================================
   PDF VIEWER CONTINU
========================================================= */

#pdfArea{

    position:absolute;

    inset:0;

    display:none;

    overflow:auto;

    background:#525252;

    -webkit-overflow-scrolling:touch;

    overscroll-behavior:contain;

    touch-action:pan-x pan-y;

    padding:18px 0 100px;
}


/*
   Conteneur de toutes les pages
*/

#pdfPages{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:18px;
}


/* =========================================================
   PAGE PDF
========================================================= */

.pdf-page-container{

    position:relative;

    display:flex;

    justify-content:center;

    width:100%;

    min-height:50px;
}


/* =========================================================
   CANVAS PDF
========================================================= */

.pdf-page-canvas{

    display:block;

    background:white;

    box-shadow:
        0 3px 15px rgba(0,0,0,.4);

    max-width:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =========================================================
   NUMÉRO DE PAGE
========================================================= */

.pdf-page-number{

    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    bottom:8px;

    background:
        rgba(20,25,32,.78);

    color:white;

    font-size:11px;

    padding:4px 8px;

    border-radius:10px;

    pointer-events:none;
}


/* =========================================================
   PLACEHOLDER PDF
========================================================= */

.pdf-placeholder{

    width:90%;

    max-width:700px;

    min-height:120px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#777;

    background:#eee;

    border-radius:4px;

}


/* =========================================================
   CONTRÔLES PDF
========================================================= */

.pdf-controls{

    position:absolute;

    left:50%;

    bottom:14px;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    gap:6px;

    background:
        rgba(20,25,32,.94);

    padding:7px;

    border-radius:12px;

    z-index:20;

    box-shadow:
        0 3px 15px rgba(0,0,0,.35);
}

.pdf-controls button{

    width:38px;

    height:38px;

    border:0;

    border-radius:7px;

    background:#343c49;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.pdf-controls button:hover{

    background:#46505e;
}

.pdf-page-indicator{

    color:white;

    font-size:13px;

    min-width:55px;

    text-align:center;

    white-space:nowrap;
}


/* =========================================================
   CHARGEMENT
========================================================= */

.loading{

    color:white;

    font-size:15px;

    text-align:center;
}


/* =========================================================
   MESSAGE ERREUR PDF
========================================================= */

.pdf-error{

    color:white;

    text-align:center;

    padding:40px;

    line-height:1.6;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:14px 12px;
    }

    .title{
        font-size:20px;
    }

    .grid{

        grid-template-columns:
            repeat(
                2,
                1fr
            );

        gap:9px;
    }

    .card{

        min-height:115px;

        padding:11px;
    }

    .icon{
        font-size:36px;
    }

    .card-name{
        font-size:13px;
    }

    .tools{

        overflow-x:auto;

        flex-wrap:nowrap;

        padding-bottom:9px;
    }

    .tool{
        flex-shrink:0;
    }

    .grid.list-view .card{

        grid-template-columns:
            42px
            minmax(0,1fr)
            auto;

        min-height:60px;

        padding:8px;
    }

    .grid.list-view .icon{
        font-size:27px;
    }

    .grid.list-view .card-name{
        font-size:13px;
    }

    .grid.list-view .card-info{
        font-size:11px;
    }

    .pdf-controls{

        bottom:8px;

        max-width:
            calc(100% - 16px);
    }

}


/* =========================================================
   TRÈS PETIT ÉCRAN
========================================================= */

@media(max-width:380px){

    .grid.list-view .card-info{
        display:none;
    }

    .grid.list-view .card{

        grid-template-columns:
            40px
            minmax(0,1fr);
    }

}


/* =========================================================
   AMÉLIORATIONS LECTEUR PRO
========================================================= */
#pdfArea{
    scrollbar-gutter:stable;
    padding-bottom:calc(112px + env(safe-area-inset-bottom));
    overscroll-behavior:contain;
    touch-action:pan-x pan-y;
}
#pdfPages{
    transform-origin:0 0;
    will-change:transform;
    backface-visibility:hidden;
}
.pdf-page-container{
    contain:layout paint;
}
.pdf-page-canvas{
    image-rendering:auto;
    backface-visibility:hidden;
}
.pdf-controls{
    position:fixed;
    left:50%;
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:1100;
    transform:translateX(-50%) translateZ(0);
    max-width:calc(100vw - 20px);
    padding:8px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    isolation:isolate;
}
.pdf-controls button,
.pdf-controls input{
    -webkit-tap-highlight-color:transparent;
}
.pdf-controls.is-hidden{
    display:none !important;
}
#pdfArea.is-pinching{
    overflow:hidden;
    cursor:grabbing;
}
#pdfPages{
    transform-origin:0 0;
    transform-style:flat;
    will-change:transform;
}
.pdf-page-canvas{
    /* Le canvas est affiché à sa taille PDF exacte : pas de redimensionnement CSS. */
    image-rendering:auto;
    text-rendering:geometricPrecision;
}

.pdf-page-jump{
    display:flex;
    align-items:center;
    gap:4px;
    color:#fff;
    font-size:13px;
    white-space:nowrap;
}
#pdfPageInput{
    width:52px;
    height:38px;
    border:0;
    border-radius:7px;
    padding:0 5px;
    background:#fff;
    color:#172033;
    text-align:center;
    font-size:14px;
    font-weight:600;
    outline:none;
}
#pdfPageInput:focus{
    box-shadow:0 0 0 2px #65a9ff;
}
@media(max-width:600px){
    .pdf-controls{gap:4px; bottom:calc(8px + env(safe-area-inset-bottom));}
    .pdf-controls button{width:36px;height:36px;}
    #pdfPageInput{height:36px;width:46px;}
}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header-inner">

        <div class="title">

            📚 Bibliothèque Divina Sapientia

        </div>

        <div class="subtitle">

            Partitions, documents, images,
            audios et vidéos

        </div>

    </div>

</header>



<!-- =======================================================
     RECHERCHE
======================================================= -->

<div class="search-area">

    <div class="search-box">

        <div class="search-icon">
            🔎
        </div>

        <input
            id="search"
            type="search"
            placeholder="Rechercher dans toute la bibliothèque..."
            autocomplete="off">

    </div>

</div>



<!-- =======================================================
     OUTILS
======================================================= -->

<div class="tools">


    <button
        class="tool"
        onclick="setSort('nameAsc')">

        🔤 A → Z

    </button>


    <button
        class="tool"
        onclick="setSort('nameDesc')">

        🔤 Z → A

    </button>


    <button
        class="tool"
        onclick="setSort('sizeAsc')">

        📦 Petite → Grande

    </button>


    <button
        class="tool"
        onclick="setSort('sizeDesc')">

        📦 Grande → Petite

    </button>


    <button
        id="gridButton"
        class="tool active"
        onclick="setView('grid')">

        ▦ Carrés

    </button>


    <button
        id="listButton"
        class="tool"
        onclick="setView('list')">

        ☰ Liste

    </button>


    <button
        class="tool"
        onclick="refreshLibrary()">

        🔄 Actualiser

    </button>


</div>



<!-- =======================================================
     INFORMATIONS
======================================================= -->

<div id="resultInfo"></div>



<!-- =======================================================
     BREADCRUMB
======================================================= -->

<div
    id="breadcrumb"
    class="breadcrumb">
</div>



<!-- =======================================================
     BIBLIOTHÈQUE
======================================================= -->

<main class="container">

    <div
        class="section-title"
        id="sectionTitle">

        Bibliothèque

    </div>


    <div
        id="grid"
        class="grid">

    </div>

</main>



<!-- =======================================================
     VIEWER PLEIN ÉCRAN
======================================================= -->

<div id="viewer">


    <!-- HEADER -->

    <div class="viewer-header">


        <button
            class="viewer-btn"
            onclick="closeViewer()"
            title="Fermer">

            ✕

        </button>


        <div
            id="viewerTitle"
            class="viewer-title">
        </div>


        <button
            id="viewerZoomOut"
            class="viewer-btn"
            onclick="zoomOut()"
            title="Zoom arrière">

            −

        </button>


        <button
            id="viewerZoomIn"
            class="viewer-btn"
            onclick="zoomIn()"
            title="Zoom avant">

            +

        </button>

        <button
            id="pdfToolbarToggle"
            class="viewer-btn"
            onclick="togglePDFToolbar()"
            title="Afficher ou masquer les contrôles PDF"
            aria-label="Afficher ou masquer les contrôles PDF"
            aria-pressed="false"
            style="display:none">

            ☰

        </button>


    </div>



    <!-- CORPS -->

    <div class="viewer-body">


        <div
            id="loading"
            class="loading">

            Chargement...

        </div>



        <!-- IMAGE -->

        <img
            id="imageViewer"
            style="display:none"
            draggable="false"
            alt="">



        <!-- AUDIO -->

        <audio
            id="audioViewer"
            controls
            controlsList="nodownload"
            style="display:none">

        </audio>



        <!-- VIDEO -->

        <video
            id="videoViewer"
            controls
            controlsList="nodownload noplaybackrate"
            disablePictureInPicture
            playsinline
            style="display:none">

        </video>



        <!-- PDF -->

        <div
            id="pdfArea">


            <div
                id="pdfPages">
            </div>


            <div
                id="pdfControls"
                class="pdf-controls">


                <button
                    onclick="goPreviousPDFPage()"
                    title="Page précédente">

                    ‹

                </button>


                <label class="pdf-page-jump" title="Aller directement à une page">
                    <input
                        id="pdfPageInput"
                        type="number"
                        inputmode="numeric"
                        min="1"
                        value="1"
                        aria-label="Numéro de page">
                    <span>/</span>
                    <span id="pdfPageTotal">1</span>
                </label>

                <div
                    id="pdfPageIndicator"
                    class="pdf-page-indicator"
                    style="display:none">
                    1 / 1
                </div>


                <button
                    onclick="goNextPDFPage()"
                    title="Page suivante">

                    ›

                </button>


                <button
                    onclick="zoomOut()"
                    title="Zoom arrière">

                    −

                </button>


                <button
                    onclick="zoomIn()"
                    title="Zoom avant">

                    +

                </button>


                <button
                    onclick="fitPDF()"
                    title="Adapter à la largeur">

                    ↔

                </button>


            </div>


        </div>


    </div>

</div>



<!-- =======================================================
     JAVASCRIPT
======================================================= -->

<script type="module">


/* =========================================================
   PDF.JS
========================================================= */

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";



/* =========================================================
   CONFIGURATION
========================================================= */

const JSON_URL =
    "bibliotheque.json";


const R2_BASE =
    "https://pub-03b759d4e4db40a1a34ad5132b30b4ed.r2.dev/";



/* =========================================================
   VARIABLES BIBLIOTHÈQUE
========================================================= */

let library = {

    folders:[],

    files:[]

};


let currentFolder =
    "";


let sortMode =
    localStorage.getItem(
        "divinaSort"
    ) || "nameAsc";


let viewMode =
    localStorage.getItem(
        "divinaView"
    ) || "grid";



/* =========================================================
   VARIABLES VIEWER
========================================================= */

let currentPDF =
    null;


let currentPDFUrl =
    "";


let currentPDFPage =
    1;


let currentPDFScale =
    1;


let pdfRendering =
    false;


let pdfRenderQueue = [];



/* =========================================================
   VARIABLES IMAGE
========================================================= */

let imageScale =
    1;


let imageX =
    0;


let imageY =
    0;



/* =========================================================
   ÉLÉMENTS
========================================================= */

const grid =
    document.getElementById(
        "grid"
    );


const search =
    document.getElementById(
        "search"
    );


const breadcrumb =
    document.getElementById(
        "breadcrumb"
    );


const sectionTitle =
    document.getElementById(
        "sectionTitle"
    );


const resultInfo =
    document.getElementById(
        "resultInfo"
    );


const viewer =
    document.getElementById(
        "viewer"
    );


const viewerTitle =
    document.getElementById(
        "viewerTitle"
    );


const loading =
    document.getElementById(
        "loading"
    );


const imageViewer =
    document.getElementById(
        "imageViewer"
    );


const audioViewer =
    document.getElementById(
        "audioViewer"
    );


const videoViewer =
    document.getElementById(
        "videoViewer"
    );


const pdfArea =
    document.getElementById(
        "pdfArea"
    );


const pdfPages =
    document.getElementById(
        "pdfPages"
    );


const pdfPageIndicator =
    document.getElementById(
        "pdfPageIndicator"
    );

const pdfControls =
    document.getElementById(
        "pdfControls"
    );

const pdfToolbarToggle =
    document.getElementById(
        "pdfToolbarToggle"
    );

let pdfToolbarVisible =
    localStorage.getItem("divinaPdfToolbar") !== "hidden";


const gridButton =
    document.getElementById(
        "gridButton"
    );


const listButton =
    document.getElementById(
        "listButton"
    );



/* =========================================================
   MODE D'AFFICHAGE
========================================================= */

window.setView =
function(mode){

    viewMode =
        mode;


    localStorage.setItem(
        "divinaView",
        mode
    );


    updateViewButtons();


    render();

};



function updateViewButtons(){

    if(
        viewMode ===
        "grid"
    ){

        gridButton.classList.add(
            "active"
        );

        listButton.classList.remove(
            "active"
        );

    }
    else{

        gridButton.classList.remove(
            "active"
        );

        listButton.classList.add(
            "active"
        );

    }

}



/* =========================================================
   CHARGER BIBLIOTHÈQUE
========================================================= */

async function loadLibrary(){

    try{

        const response =
            await fetch(
                JSON_URL +
                "?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "bibliotheque.json inaccessible"
            );

        }


        library =
            await response.json();


        updateViewButtons();


        render();

    }
    catch(error){

        console.error(
            error
        );


        grid.innerHTML = `

            <div class="empty">

                ❌ Impossible de charger
                la bibliothèque.

                <br><br>

                Vérifiez votre connexion
                Internet.

/* =========================================================
   URL R2
========================================================= */

function getURL(key){

    return (

        R2_BASE +

        key
            .split("/")
            .map(
                part =>
                    encodeURIComponent(
                        part
                    )
            )
            .join("/")

    );

}



/* =========================================================
   FORMAT TAILLE
========================================================= */

function formatSize(bytes){

    if(
        bytes < 1024
    ){

        return (
            bytes +
            " o"
        );

    }


    if(
        bytes <
        1024 * 1024
    ){

        return (

            (
                bytes /
                1024
            ).toFixed(1)

            +
            " Ko"

        );

    }


    if(
        bytes <
        1024 *
        1024 *
        1024
    ){

        return (

            (
                bytes /
                1024 /
                1024
            ).toFixed(1)

            +
            " Mo"

        );

    }


    return (

        (
            bytes /
            1024 /
            1024 /
            1024
        ).toFixed(2)

        +
        " Go"

    );

}

   ICÔNES

function getIcon(type){

    switch(type){

        case "pdf":

        case "image":

        case "audio":

        case "spreadsheet":

}

   TRI

window.setSort =
function(mode){

    sortMode =
        mode;


    localStorage.setItem(
        "divinaSort",
        mode
    );


    render();

};



function compareItems(a,b){

    if(
        sortMode ===
        "nameAsc"
    ){

        return a.name.localeCompare(
            b.name,
            "fr",
            {
                sensitivity:"base",
                numeric:true
            }
        );

    }


    if(
        sortMode ===
        "nameDesc"
    ){

        return b.name.localeCompare(
            a.name,
            "fr",
            {
                sensitivity:"base",
                numeric:true
            }
        );

    }


    if(
        sortMode ===
        "sizeAsc"
    ){

        return (
            a.size || 0
        ) -
        (
            b.size || 0
        );

    }


    if(
        sortMode ===
        "sizeDesc"
    ){

        return (
            b.size || 0
        ) -
        (
            a.size || 0
        );

    }


    return 0;

}



/* =========================================================
   RECHERCHE GLOBALE
========================================================= */

function globalSearch(term){

    term =
        term
        .trim()
        .toLowerCase();


    if(!term){

        return null;

    }


    const files =
        library.files.filter(
            file => {

                const text = (

                    file.name +
                    " " +
                    file.key +
                    " " +
                    file.folder +
                    " " +
                    file.type +
                    " " +
                    file.extension

                ).toLowerCase();


                return text.includes(
                    term
                );

            }
        );


    const folders =
        library.folders.filter(
            folder =>

                folder
                    .toLowerCase()
                    .includes(
                        term
                    )
        );


    return {

        files,

        folders

    };

}

/* =========================================================
   DOSSIERS ACTUELS
========================================================= */

function getCurrentFolders(){

    const prefix =

        currentFolder
        ?
        currentFolder + "/"
        :
        "";


    const folders = [];


    for(
        const folder of
        library.folders
    ){

        if(
            !folder.startsWith(
                prefix
            )
        ){

            continue;

        }


        const rest =
            folder.slice(
                prefix.length
            );


        if(

            rest &&
            !rest.includes("/")

        ){

            folders.push(
                folder
            );

        }

    }


    return folders;

}



/* =========================================================
   FICHIERS ACTUELS
========================================================= */

function getCurrentFiles(){

    return library.files.filter(
        file =>

            (
                file.folder ||
                ""

            currentFolder
    );

}

========================================================= */

function escapeHTML(
    value
){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

async function openPDF(
    url
){

        "block";

    try{

        currentPDF =
            await pdfjsLib
                .getDocument({

                })
                .promise;


        currentPDFPage =
            1;


        /*

           largeur de l'écran
        */

        currentPDFScale =
            await calculateFitScale();


        loading.style.display =
            "none";


        /*
           Prépare toutes les pages
        */

        createPDFPageContainers();


        /*
           Rend progressivement
           les pages visibles
        */

        await renderVisiblePDFPages();


        updatePDFPageIndicator();


    }
    catch(error){

        console.error(
            "Erreur PDF :",
            error
        );

        loading.style.display =
            "none";

    }

/* =========================================================
   CALCULER ZOOM ADAPTÉ À L'ÉCRAN
========================================================= */

async function calculateFitScale(){

    if(
        !currentPDF
    ){

        return 1;

    }


    const page =
        await currentPDF.getPage(
            1
        );


    const viewport =
        page.getViewport({
            scale:1
        });


    const availableWidth =
        pdfArea.clientWidth -
        20;


    let scale =
        availableWidth /
        viewport.width;


    /*
       Empêche un zoom initial
       excessivement grand
    */

    scale =
        Math.max(
            0.5,
            Math.min(
                scale,
                2.5
            )
        );


    return scale;

}



/* =========================================================
   CRÉER LES CONTENEURS DE PAGES
========================================================= */

function createPDFPageContainers(){

    pdfPages.innerHTML =
        "";


    if(
        !currentPDF
    ){

        return;

    }


    for(
        let i = 1;
        i <= currentPDF.numPages;
        i++
    ){

        const container =
            document.createElement(
                "div"
            );


        container.className =
            "pdf-page-container";


        container.dataset.page =
            i;


        const placeholder =
            document.createElement(
                "div"
            );


        placeholder.className =
            "pdf-placeholder";


        placeholder.textContent =
            "Chargement de la page " +
            i +
            "…";


        container.appendChild(
            placeholder
        );


        pdfPages.appendChild(
            container
        );

    }

}



/* =========================================================
   RENDU PROGRESSIF
========================================================= */

let pdfObserver =
    null;



function setupPDFLazyRendering(){

    if(
        pdfObserver
    ){

        pdfObserver.disconnect();

    }


    pdfObserver =
        new IntersectionObserver(
            entries => {

                entries.forEach(
                    entry => {

                        if(
                            entry.isIntersecting
                        ){

                            const page =
                                Number(
                                    entry
                                        .target
                                        .dataset
                                        .page
                                );


                            renderPDFPage(
                                page
                            );

                        }

                    }
                );

            },
            {
                root:
                    pdfArea,

                rootMargin:
                    "500px 0px 500px 0px",

                threshold:
                    0.01
            }
        );


    document
        .querySelectorAll(
            ".pdf-page-container"
        )
        .forEach(
            container => {

                pdfObserver.observe(
                    container
                );

            }
        );

}



/* =========================================================
   RENDRE UNE PAGE PDF
========================================================= */

async function renderPDFPage(
    pageNumber
){

    if(
        !currentPDF
    ){

        return;

    }


    const container =
        document.querySelector(
            `.pdf-page-container[data-page="${pageNumber}"]`
        );


    if(
        !container
    ){

        return;

    }


    /*
       Ne pas refaire le rendu
       si la page est déjà rendue
    */

    if(
        container.dataset.rendered ===
        "true"
    ){

        return;

    }


    if(
        container.dataset.rendering ===
        "true"
    ){

        return;

    }


    container.dataset.rendering =
        "true";


    try{

        const page =
            await currentPDF.getPage(
                pageNumber
            );


        const viewport =
            page.getViewport({
                scale:
                    currentPDFScale
            });


            // Sur-échantillonnage pour conserver des textes nets après zoom.
            // La limite évite une consommation mémoire excessive sur les gros PDF.
            // Rendu adaptatif haute définition : priorité à la netteté du texte,
            // avec une limite sûre pour éviter les erreurs mémoire sur les grands PDF.
            const deviceDPR = window.devicePixelRatio || 1;
            const pagePixels = viewport.width * viewport.height;
            const memorySafeDPR = pagePixels > 6000000 ? 2.5 : 4;
            const dpr = Math.min(
                Math.max(deviceDPR, 2),
                memorySafeDPR
            );


        const canvas =
            document.createElement(
                "canvas"
            );


        canvas.className =
            "pdf-page-canvas";


        canvas.width =
            Math.floor(
                viewport.width *
                dpr
            );


        canvas.height =
            Math.floor(
                viewport.height *
                dpr
            );


        canvas.style.width =
            viewport.width +
            "px";


        canvas.style.height =
            viewport.height +
            "px";


        const context =
            canvas.getContext(
                "2d"
            );


        const renderContext = {

            canvasContext:
                context,

            viewport:
                viewport,

            intent:
                "display",

            enableWebGL:
                true,

            transform:[
                dpr,
                0,
                0,
                dpr,
                0,
                0
            ]

        };


        container.innerHTML =
            "";


        container.appendChild(
            canvas
        );


        const pageNumberLabel =
            document.createElement(
                "div"
            );


        pageNumberLabel.className =
            "pdf-page-number";


        pageNumberLabel.textContent =
            pageNumber;


        container.appendChild(
            pageNumberLabel
        );


        await page.render(
            renderContext
        ).promise;


        container.dataset.rendered =
            "true";


        container.dataset.rendering =
            "false";

    }
    catch(error){

        console.error(
            "Erreur page PDF",
            pageNumber,
            error
        );


        container.innerHTML = `

            <div class="pdf-placeholder">

                ❌ Page ${pageNumber}
                impossible à charger

            </div>

        `;


        container.dataset.rendering =
            "false";

    }

}



/* =========================================================
   RENDRE LES PREMIÈRES PAGES
========================================================= */

async function renderVisiblePDFPages(){

    if(
        !currentPDF
    ){

        return;

    }


    /*
       Rend d'abord les premières
       pages afin que l'ouverture
       soit immédiate.
    */

    const initialCount =
        Math.min(
            currentPDF.numPages,
            3
        );


    for(
        let i = 1;
        i <= initialCount;
        i++
    ){

        await renderPDFPage(
            i
        );

    }

}



/* =========================================================
   PAGE PDF ACTUELLE
========================================================= */

function getCurrentVisiblePDFPage(){

    if(
        !currentPDF
    ){

        return 1;

    }


    const containers =
        document.querySelectorAll(
            ".pdf-page-container"
        );


    const viewerRect =
        pdfArea.getBoundingClientRect();


    let closestPage =
        1;


    let closestDistance =
        Infinity;


    containers.forEach(
        container => {

            const rect =
                container.getBoundingClientRect();


            const pageCenter =
                rect.top +
                rect.height /
                2;


            const viewerCenter =
                viewerRect.top +
                viewerRect.height /
                2;


            const distance =
                Math.abs(
                    pageCenter -
                    viewerCenter
                );


            if(
                distance <
                closestDistance
            ){

                closestDistance =
                    distance;


                closestPage =
                    Number(
                        container
                            .dataset
                            .page
                    );

            }

        }
    );


    return closestPage;

}

/* =========================================================
   SURVEILLANCE DU DÉFILEMENT PDF
========================================================= */

let pdfScrollTimer =
    null;


pdfArea.addEventListener(
    "scroll",
    function(){

        clearTimeout(
            pdfScrollTimer
        );


        /*
           Mise à jour légère
        */

        updatePDFPageIndicator();


        /*
           Après arrêt du défilement,
           on s'assure que les pages
           proches sont rendues.
        */

        pdfScrollTimer =
            setTimeout(
                () => {

                    renderNearbyPDFPages();

                },
                100
            );

    },
    {
        passive:true
    }
);



async function renderNearbyPDFPages(){

    if(
        !currentPDF
    ){

        return;

    }


    const page =
        getCurrentVisiblePDFPage();


    const start =
        Math.max(
            1,
            page - 2
        );


    const end =
        Math.min(
            currentPDF.numPages,
            page + 2
        );


    for(
        let i = start;
        i <= end;
        i++
    ){

        await renderPDFPage(
            i
        );

    }

}



/* =========================================================
   ALLER À UNE PAGE
========================================================= */

function scrollToPDFPage(
    pageNumber
){

    const container =
        document.querySelector(
            `.pdf-page-container[data-page="${pageNumber}"]`
        );


    if(
        !container
    ){

        return;

    }


    container.scrollIntoView({

        behavior:
            "smooth",

        block:
            "start"

    });


    /*
       La page sera rendue
       par IntersectionObserver.
    */

}



/* =========================================================
   PAGE PRÉCÉDENTE
========================================================= */

window.goPreviousPDFPage =
function(){

    if(
        !currentPDF
    ){

        return;

    }


    const page =
        getCurrentVisiblePDFPage();


    if(
        page > 1
    ){

        scrollToPDFPage(
            page - 1
        );

};



/* =========================================================
   PAGE SUIVANTE
========================================================= */

window.goNextPDFPage =
function(){

    if(
        !currentPDF
    ){

        return;

    }


    const page =
        getCurrentVisiblePDFPage();


    if(
        page <
        currentPDF.numPages
    ){

        );

    }

};

window.zoomIn =

/* =========================================================

window.zoomOut =
async function(){

        );

};



/* =========================================================
   CHANGER ÉCHELLE PDF
========================================================= */

async function changePDFScale(
    multiplier
){

    if(
        !currentPDF
    ){

        return;

    }


    const currentPage =
        getCurrentVisiblePDFPage();


    currentPDFScale =
        Math.max(
            0.5,
            Math.min(
                currentPDFScale *
                multiplier,
                5
            )
        );


    /*
       Les canvases existants
       doivent être recréés.
    */

    document
        .querySelectorAll(
            ".pdf-page-container"
        )
        .forEach(
            container => {

                delete container.dataset.rendered;

                delete container.dataset.rendering;

                container.innerHTML = `

                    <div
                        class="pdf-placeholder">

                        Chargement…

                    </div>

                `;

            }
        );


    /*
       Recalcule le document
       à la nouvelle taille.
    */

    await renderNearbyPDFPages();


    /*
       On retourne à la page
       où se trouvait l'utilisateur.
    */

    setTimeout(
        () => {

            scrollToPDFPage(
                currentPage
            );

        },
        50
    );

}



/* =========================================================
   ADAPTER PDF À LA LARGEUR
========================================================= */

window.fitPDF =
async function(){

    if(
        !currentPDF
    ){

        return;

    }


    const currentPage =
        getCurrentVisiblePDFPage();


    currentPDFScale =
        await calculateFitScale();


    document
        .querySelectorAll(
            ".pdf-page-container"
        )
        .forEach(
            container => {

                delete container.dataset.rendered;

                delete container.dataset.rendering;

                container.innerHTML = `

                    <div
                        class="pdf-placeholder">

                        Chargement…

                    </div>

                `;

            }
        );


    await renderNearbyPDFPages();


    setTimeout(
        () => {

            scrollToPDFPage(
                currentPage
            );

        },
        50
    );

};



/* =========================================================
   ZOOM IMAGE
========================================================= */

function resetImageZoom(){

    imageScale =
        1;


    imageX =
        0;


    imageY =
        0;


    applyImageTransform();

}



function applyImageTransform(){

    imageViewer.style.transform =

        `translate(
            ${imageX}px,
            ${imageY}px
        )
        scale(
            ${imageScale}
        )`;

}



/* =========================================================
   GESTES IMAGE
========================================================= */

let imageTouchStartDistance =
    null;


let imageTouchStartScale =
    1;


let imageDragStartX =
    0;


let imageDragStartY =
    0;


let imageStartX =
    0;


let imageStartY =
    0;



imageViewer.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length === 2
        ){

            imageTouchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            imageTouchStartScale =
                imageScale;

        }


        else if(

            event.touches.length === 1 &&
            imageScale > 1

        ){

            imageDragStartX =
                event.touches[0]
                    .clientX;


            imageDragStartY =
                event.touches[0]
                    .clientY;


            imageStartX =
                imageX;


            imageStartY =
                imageY;

        }

    },
    {
        passive:false
    }
);



imageViewer.addEventListener(
    "touchmove",
    function(event){

        event.preventDefault();


        if(
            event.touches.length === 2
        ){

            const distance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            if(
                imageTouchStartDistance
            ){

                const ratio =
                    distance /
                    imageTouchStartDistance;


                imageScale =
                    Math.max(
                        0.5,
                        Math.min(
                            imageTouchStartScale *
                            ratio,
                            6
                        )
                    );


                applyImageTransform();

            }


            return;

        }


        if(

            event.touches.length === 1 &&
            imageScale > 1

        ){

            const dx =
                event.touches[0]
                    .clientX -
                imageDragStartX;


            const dy =
                event.touches[0]
                    .clientY -
                imageDragStartY;


            imageX =
                imageStartX +
                dx;


            imageY =
                imageStartY +
                dy;


            applyImageTransform();

        }

    },
    {
        passive:false
    }
);



imageViewer.addEventListener(
    "touchend",
    function(){

        imageTouchStartDistance =
            null;

    }
);



/* =========================================================
   GESTES PDF : PINCEMENT À DEUX DOIGTS
========================================================= */

let pdfTouchStartDistance =
    null;


let pdfTouchStartScale =
    1;


let pdfTouchCurrentScale =
    1;



pdfArea.addEventListener(
    "touchstart",
    function(event){

        if(
            event.touches.length === 2
        ){

            pdfTouchStartDistance =
                getTouchDistance(
                    event.touches[0],
                    event.touches[1]
                );


            pdfTouchStartScale =
                currentPDFScale;


            pdfTouchCurrentScale =
                currentPDFScale;

        }

    },
    {
        passive:false
    }
);



pdfArea.addEventListener(
    "touchmove",
    function(event){

        if(
            event.touches.length !== 2
        ){

            return;

        }


        event.preventDefault();


        const distance =
            getTouchDistance(
                event.touches[0],
                event.touches[1]
            );


        if(
            pdfTouchStartDistance
        ){

            const ratio =
                distance /
                pdfTouchStartDistance;


            pdfTouchCurrentScale =
                Math.max(
                    0.5,
                    Math.min(
                        pdfTouchStartScale *
                        ratio,
                        5
                    )
                );

        }

    },
    {
        passive:false
    }
);



pdfArea.addEventListener(
    "touchend",
    async function(){

        if(
            pdfTouchStartDistance
        ){

            const newScale =
                pdfTouchCurrentScale;


            pdfTouchStartDistance =
                null;


            if(
                Math.abs(
                    newScale -
                    currentPDFScale
                ) > 0.03
            ){

                const currentPage =
                    getCurrentVisiblePDFPage();


                currentPDFScale =
                    newScale;


                document
                    .querySelectorAll(
                        ".pdf-page-container"
                    )
                    .forEach(
                        container => {

                            delete container
                                .dataset
                                .rendered;

                            delete container
                                .dataset
                                .rendering;

                            container.innerHTML = `

                                <div
                                    class="pdf-placeholder">

                                    Chargement…

                                </div>

                            `;

                        }
                    );


                await renderNearbyPDFPages();


                setTimeout(
                    () => {

                        scrollToPDFPage(
                            currentPage
                        );

                    },
                    50
                );

            }

        }

    }
);



/* =========================================================
   DISTANCE ENTRE DEUX DOIGTS
========================================================= */

function getTouchDistance(
    a,
    b
){

    const dx =
        a.clientX -
        b.clientX;


    const dy =
        a.clientY -
        b.clientY;


    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}

/* =========================================================
   COUCHE D'INTERACTION PRO : PAGE DIRECTE + PINCH FLUIDE
========================================================= */
const pdfPageInput = document.getElementById("pdfPageInput");
const pdfPageTotal = document.getElementById("pdfPageTotal");
let pdfPinch = null;
let pdfPinchRaf = 0;

function syncPDFPageField(page = currentPDFPage){
    if (!pdfPageInput || !pdfPageTotal) return;
    const total = currentPDF ? currentPDF.numPages : 1;
    pdfPageInput.max = String(total);
    pdfPageInput.value = String(Math.max(1, Math.min(total, page || 1)));
    pdfPageTotal.textContent = String(total);
}

if (pdfPageInput){
    const jump = () => {
        if (!currentPDF) return;
        const page = Math.max(1, Math.min(currentPDF.numPages,
            Number.parseInt(pdfPageInput.value, 10) || 1));
        pdfPageInput.value = String(page);
        scrollToPDFPage(page);
        renderPDFPage(page);
    };
    pdfPageInput.addEventListener("change", jump);
    pdfPageInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            jump();
            pdfPageInput.blur();
        }
    });
}

const originalUpdatePDFPageIndicator = updatePDFPageIndicator;
updatePDFPageIndicator = function(){
    originalUpdatePDFPageIndicator();
    syncPDFPageField(currentPDFPage);
};

const originalOpenPDF = openPDF;
openPDF = async function(url){
    await originalOpenPDF(url);
    syncPDFPageField(1);
    applyPDFToolbarVisibility();
};

const originalResetViewer = resetViewer;
resetViewer = function(){
    if (pdfPages) {
        pdfPages.style.transform = "none";
        pdfPages.style.transformOrigin = "0 0";
    }
    pdfPinch = null;
    if (pdfControls) pdfControls.classList.remove("is-hidden");
    if (pdfToolbarToggle) pdfToolbarToggle.style.display = "none";
    syncPDFPageField(1);
    originalResetViewer();
};

// Navigation sans scrollIntoView : le header et la barre fixe ne déplacent pas la page.
scrollToPDFPage = function(pageNumber){
    if (!currentPDF) return;
    const page = Math.max(1, Math.min(currentPDF.numPages, Number(pageNumber) || 1));
    const container = document.querySelector(`.pdf-page-container[data-page="${page}"]`);
    if (!container) return;
    pdfArea.scrollTo({
        top: Math.max(0, container.offsetTop - 18),
        behavior: "smooth"
    });
    renderPDFPage(page);
    syncPDFPageField(page);
};

function getPDFTouchCenter(a, b){
    const rect = pdfArea.getBoundingClientRect();
    return {
        x: (a.clientX + b.clientX) / 2 - rect.left,
        y: (a.clientY + b.clientY) / 2 - rect.top
    };
}

function applyPinchPreview(){
    if (!pdfPinch) return;

    const relativeScale = pdfPinch.scale / pdfPinch.startScale;
    // Coordonnée écran exacte du foyer : le point PDF ne glisse jamais.
    const tx = pdfPinch.midX + pdfPinch.startScrollLeft
        - (pdfPinch.focalX * relativeScale);
    const ty = pdfPinch.midY + pdfPinch.startScrollTop
        - (pdfPinch.focalY * relativeScale);

    pdfPages.style.transformOrigin = "0 0";
    pdfPages.style.transform =
        `translate3d(${tx}px, ${ty}px, 0) scale(${relativeScale})`;

    // Empêche le navigateur de modifier la référence pendant le geste.
    if (pdfArea.scrollLeft !== pdfPinch.startScrollLeft) {
        pdfArea.scrollLeft = pdfPinch.startScrollLeft;
    }
    if (pdfArea.scrollTop !== pdfPinch.startScrollTop) {
        pdfArea.scrollTop = pdfPinch.startScrollTop;
    }
}

// Pinch précis : aucun scroll natif ne vient concurrencer le zoom.
pdfArea.addEventListener("touchstart", event => {
    if (event.touches.length !== 2 || !currentPDF) return;
    event.stopImmediatePropagation();

    const a = event.touches[0];
    const b = event.touches[1];
    const center = getPDFTouchCenter(a, b);
    const startScrollLeft = pdfArea.scrollLeft;
    const startScrollTop = pdfArea.scrollTop;

    pdfPinch = {
        startDistance: getTouchDistance(a, b),
        startScale: currentPDFScale,
        scale: currentPDFScale,
        startMidX: center.x,
        startMidY: center.y,
        midX: center.x,
        midY: center.y,
        startScrollLeft,
        startScrollTop,
        // Coordonnée dans le document rendu, sous le point de contact initial.
        focalX: center.x + startScrollLeft,
        focalY: center.y + startScrollTop
    };

    pdfArea.classList.add("is-pinching");
    event.preventDefault();
}, {passive:false, capture:true});

pdfArea.addEventListener("touchmove", event => {
    if (!pdfPinch || event.touches.length !== 2) return;
    event.stopImmediatePropagation();
    event.preventDefault();

    const a = event.touches[0];
    const b = event.touches[1];
    const center = getPDFTouchCenter(a, b);

    pdfPinch.scale = Math.max(.5, Math.min(5,
        pdfPinch.startScale *
        getTouchDistance(a, b) / pdfPinch.startDistance));
    pdfPinch.midX = center.x;
    pdfPinch.midY = center.y;

    if (!pdfPinchRaf) {
        pdfPinchRaf = requestAnimationFrame(() => {
            pdfPinchRaf = 0;
            applyPinchPreview();
        });
    }
}, {passive:false, capture:true});

async function finishPDFPinch(event){
    if (event) event.stopImmediatePropagation();
    if (!pdfPinch) return;

    if (pdfPinchRaf) {
        cancelAnimationFrame(pdfPinchRaf);
        pdfPinchRaf = 0;
    }
    applyPinchPreview();

    const pinch = pdfPinch;
    const finalScale = pinch.scale;
    const finalMidX = pinch.midX;
    const finalMidY = pinch.midY;
    const page = getCurrentVisiblePDFPage();

    pdfPinch = null;
    pdfArea.classList.remove("is-pinching");
    pdfPages.style.transform = "none";
    pdfPages.style.transformOrigin = "0 0";

    if (Math.abs(finalScale - currentPDFScale) < .005) return;

    // Compensation exacte : le même point du PDF reste sous les doigts
    // lorsque les canvases haute résolution remplacent l’aperçu CSS.
    const ratio = finalScale / pinch.startScale;
    const targetScrollLeft = Math.max(0,
        (pinch.focalX * ratio) - finalMidX);
    const targetScrollTop = Math.max(0,
        (pinch.focalY * ratio) - finalMidY);

    currentPDFScale = finalScale;
    document.querySelectorAll(".pdf-page-container").forEach(container => {
        delete container.dataset.rendered;
        delete container.dataset.rendering;
        container.innerHTML =
            '<div class="pdf-placeholder">Chargement…</div>';
    });

    await renderNearbyPDFPages();

    // On applique la position après le nouveau layout, sans scrollIntoView.
    requestAnimationFrame(() => {
        pdfArea.scrollTo({
            left: targetScrollLeft,
            top: targetScrollTop,
            behavior: "instant"
        });
        updatePDFPageIndicator();
    });
}

pdfArea.addEventListener("touchend", finishPDFPinch,
    {passive:true, capture:true});
pdfArea.addEventListener("touchcancel", finishPDFPinch,
    {passive:true, capture:true});

// Navigation clavier de bureau.
document.addEventListener("keydown", event => {
    if (!viewer.classList.contains("active") || !currentPDF) return;
    if (event.target === pdfPageInput) return;
    if (event.key === "ArrowRight" || event.key === "PageDown") {
        event.preventDefault();
        goNextPDFPage();
    }
    if (event.key === "ArrowLeft" || event.key === "PageUp") {
        event.preventDefault();
        goPreviousPDFPage();
    }
    if (event.key === "Home") {
        event.preventDefault();
        scrollToPDFPage(1);
    }
    if (event.key === "End") {
        event.preventDefault();
        scrollToPDFPage(currentPDF.numPages);
    }
}, {passive:false});

</script>
