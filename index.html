<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bibliothèque Divina Sapientia</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #172033;
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   BIBLIOTHÈQUE
========================= */

#library {
    min-height: 100vh;
    width: 100%;
}

.header {
    background: linear-gradient(135deg, #0b2d5c, #164d91);
    color: white;
    padding: 22px 18px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 34px);
}

.header p {
    margin: 8px 0 0;
    opacity: 0.9;
    font-size: clamp(13px, 3.5vw, 16px);
}

.container {
    width: min(1100px, 94%);
    margin: auto;
    padding: 18px 0 40px;
}

.search-box {
    width: 100%;
    margin-bottom: 18px;
}

.search-box input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d6dce5;
    border-radius: 12px;
    background: white;
    outline: none;
    font-size: 16px;
}

.search-box input:focus {
    border-color: #164d91;
}

.path-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.back-button {
    border: none;
    background: #0b2d5c;
    color: white;
    border-radius: 10px;
    padding: 10px 15px;
}

.current-path {
    font-size: 14px;
    color: #5b6472;
    overflow-wrap: anywhere;
}

.items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
}

.item {
    background: white;
    border: 1px solid #e0e5ec;
    border-radius: 15px;
    padding: 20px 14px;
    min-height: 145px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: transform .15s, box-shadow .15s;
}

.item:active {
    transform: scale(.97);
}

.item:hover {
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.icon {
    font-size: 46px;
    margin-bottom: 10px;
}

.name {
    width: 100%;
    font-size: 15px;
    font-weight: 600;
    overflow-wrap: anywhere;
}

.info {
    margin-top: 7px;
    color: #7a8493;
    font-size: 12px;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #707987;
}

/* =========================
   LECTEUR
========================= */

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    background: #0b0e14;
    z-index: 999999;
    color: white;
}

.viewer-header {
    height: 58px;
    min-height: 58px;
    background: #111722;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255,255,255,.1);
}

.viewer-title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.close-button,
.viewer-button {
    border: none;
    color: white;
    background: #263142;
    border-radius: 9px;
    padding: 9px 13px;
    font-size: 14px;
}

.close-button {
    background: #a92525;
}

.viewer-content {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* =========================
   IMAGE
========================= */

#imageViewer {
    display: none;
    width: 100%;
    height: 100%;
    padding: 12px;
    overflow: auto;
    justify-content: center;
    align-items: center;
}

#imageViewer img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}

/* =========================
   AUDIO
========================= */

#audioViewer {
    display: none;
    width: min(700px, 92%);
    padding: 25px;
    text-align: center;
}

.audio-icon {
    font-size: 80px;
    margin-bottom: 20px;
}

#audioViewer audio {
    width: 100%;
}

/* =========================
   VIDEO
========================= */

#videoViewer {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

#videoViewer video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
}

/* =========================
   PDF
========================= */

#pdfViewer {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    background: #222;
}

.pdf-toolbar {
    min-height: 52px;
    background: #151a22;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 7px;
    flex-wrap: wrap;
    z-index: 5;
}

.pdf-toolbar button {
    border: none;
    background: #303947;
    color: white;
    border-radius: 8px;
    padding: 8px 12px;
}

.pdf-page-info {
    font-size: 13px;
    min-width: 90px;
    text-align: center;
}

.pdf-area {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 15px;
    background: #343434;
}

#pdfCanvas {
    display: block;
    background: white;
    box-shadow: 0 3px 18px rgba(0,0,0,.45);
    max-width: none;
}

/* =========================
   AUTRES FICHIERS
========================= */

#otherViewer {
    display: none;
    text-align: center;
    padding: 30px;
}

#otherViewer .big-icon {
    font-size: 70px;
    margin-bottom: 15px;
}

/* =========================
   CHARGEMENT
========================= */

.loading {
    position: fixed;
    inset: 0;
    background: rgba(11,14,20,.92);
    color: white;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1000000;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 4px solid rgba(255,255,255,.25);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        width: 94%;
        padding-top: 14px;
    }

    .items {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .item {
        min-height: 125px;
        padding: 15px 8px;
    }

    .icon {
        font-size: 38px;
    }

    .name {
        font-size: 13px;
    }

    .viewer-header {
        height: 54px;
        min-height: 54px;
    }

    .viewer-content {
        top: 54px;
    }

    .close-button,
    .viewer-button {
        padding: 8px 10px;
    }

    .pdf-toolbar {
        min-height: 48px;
    }

    .pdf-toolbar button {
        padding: 7px 9px;
        font-size: 13px;
    }

    .pdf-area {
        padding: 8px;
    }
}
</style>
</head>

<body>

<!-- =========================
     BIBLIOTHÈQUE
========================= -->

<div id="library">

    <header class="header">
        <h1>📚 Divina Sapientia</h1>
        <p>Bibliothèque des partitions et ressources</p>
    </header>

    <main class="container">

        <div class="search-box">
            <input
                id="search"
                type="search"
                placeholder="🔎 Rechercher un fichier..."
                autocomplete="off"
            >
        </div>

        <div class="path-bar">
            <button id="backButton" class="back-button">
                ← Retour
            </button>

            <div id="currentPath" class="current-path">
                Bibliothèque
            </div>
        </div>

        <div id="items" class="items"></div>

    </main>
</div>


<!-- =========================
     LECTEUR PLEIN ÉCRAN
========================= -->

<div id="viewer">

    <div class="viewer-header">

        <button class="close-button" onclick="closeViewer()">
            ✕ Fermer
        </button>

        <div id="viewerTitle" class="viewer-title">
            Lecteur
        </div>

    </div>

    <div class="viewer-content">

        <!-- IMAGE -->
        <div id="imageViewer">
            <img id="imageElement" alt="">
        </div>

        <!-- AUDIO -->
        <div id="audioViewer">
            <div class="audio-icon">🎵</div>
            <h2 id="audioTitle">Audio</h2>

            <audio
                id="audioElement"
                controls
                controlsList="nodownload"
                preload="metadata"
            ></audio>
        </div>

        <!-- VIDEO -->
        <div id="videoViewer">

            <video
                id="videoElement"
                controls
                controlsList="nodownload noplaybackrate"
                disablePictureInPicture
                playsinline
                preload="metadata"
            ></video>

        </div>

        <!-- PDF -->
        <div id="pdfViewer">

            <div class="pdf-toolbar">

                <button onclick="previousPage()">
                    ◀
                </button>

                <div id="pdfPageInfo" class="pdf-page-info">
                    Page 1 / 1
                </div>

                <button onclick="nextPage()">
                    ▶
                </button>

                <button onclick="zoomOut()">
                    −
                </button>

                <button onclick="zoomIn()">
                    +
                </button>

                <button onclick="fitWidth()">
                    ↔
                </button>

            </div>

            <div id="pdfArea" class="pdf-area">
                <canvas id="pdfCanvas"></canvas>
            </div>

        </div>

        <!-- AUTRES -->
        <div id="otherViewer">

            <div class="big-icon">📁</div>

            <h2>Fichier</h2>

            <p>
                Ce type de fichier ne possède pas encore
                de lecteur intégré.
            </p>

        </div>

    </div>
</div>


<!-- CHARGEMENT -->

<div id="loading" class="loading">

    <div class="spinner"></div>

    <div id="loadingText">
        Chargement...
    </div>

</div>


<!-- =========================
     PDF.JS
========================= -->

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =========================
   CONFIGURATION
========================= */

const R2_BASE =
"https://pub-03b759d4e4db40a1a34ad5132b30b4ed.r2.dev/";

const JSON_URL =
"https://kakulekatavumerveille-code.github.io/divina-sapientia-library/bibliotheque.json";


/* =========================
   VARIABLES
========================= */

let libraryData = null;
let currentFolder = "";
let searchText = "";

let currentPDF = null;
let currentPDFPage = 1;
let currentPDFScale = 1;

let currentPDFRendering = false;
let currentPDFPendingPage = null;


/* =========================
   ELEMENTS
========================= */

const items = document.getElementById("items");
const search = document.getElementById("search");
const currentPath = document.getElementById("currentPath");
const backButton = document.getElementById("backButton");

const viewer = document.getElementById("viewer");
const viewerTitle = document.getElementById("viewerTitle");

const imageViewer = document.getElementById("imageViewer");
const imageElement = document.getElementById("imageElement");

const audioViewer = document.getElementById("audioViewer");
const audioElement = document.getElementById("audioElement");
const audioTitle = document.getElementById("audioTitle");

const videoViewer = document.getElementById("videoViewer");
const videoElement = document.getElementById("videoElement");

const pdfViewer = document.getElementById("pdfViewer");
const pdfCanvas = document.getElementById("pdfCanvas");
const pdfArea = document.getElementById("pdfArea");
const pdfPageInfo = document.getElementById("pdfPageInfo");

const otherViewer = document.getElementById("otherViewer");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");


/* =========================
   OUTILS
========================= */

function showLoading(message = "Chargement...") {
    loadingText.textContent = message;
    loading.style.display = "flex";
}

function hideLoading() {
    loading.style.display = "none";
}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatSize(bytes) {

    if (!bytes) return "0 octet";

    const units = ["octets", "Ko", "Mo", "Go"];

    let i = 0;
    let size = bytes;

    while (size >= 1024 && i < units.length - 1) {
        size /= 1024;
        i++;
    }

    return size.toFixed(size >= 10 || i === 0 ? 0 : 1) +
        " " + units[i];
}

function getURL(file) {

    return R2_BASE +
        file.key
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
}

function getIcon(type) {

    switch (type) {

        case "pdf":
            return "📄";

        case "image":
            return "🖼️";

        case "audio":
            return "🎵";

        case "video":
            return "🎬";

        case "document":
            return "📝";

        case "spreadsheet":
            return "📊";

        case "presentation":
            return "📽️";

        case "archive":
            return "🗜️";

        default:
            return "📁";
    }
}


/* =========================
   CHARGER JSON
========================= */

async function loadLibrary() {

    try {

        /*
         * Paramètre anti-cache.
         * Il oblige le navigateur à demander
         * la version actuelle du JSON.
         */

        const url =
            JSON_URL +
            "?v=" +
            Date.now();

        const response = await fetch(
            url,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Erreur JSON");
        }

        libraryData = await response.json();

        renderLibrary();

    } catch (error) {

        console.error(error);

        items.innerHTML = `
            <div class="empty">
                ❌ Impossible de charger la bibliothèque.
                <br><br>
                Vérifiez votre connexion Internet.
            </div>
        `;
    }
}


/* =========================
   AFFICHER BIBLIOTHÈQUE
========================= */

function renderLibrary() {

    if (!libraryData) return;

    items.innerHTML = "";

    currentPath.textContent =
        currentFolder
            ? "Bibliothèque / " + currentFolder
            : "Bibliothèque";


    /* Recherche globale */

    if (searchText.trim() !== "") {

        const query =
            searchText
                .trim()
                .toLowerCase();

        const results =
            libraryData.files.filter(file =>
                file.name.toLowerCase().includes(query) ||
                file.key.toLowerCase().includes(query)
            );

        if (results.length === 0) {

            items.innerHTML = `
                <div class="empty">
                    Aucun fichier trouvé.
                </div>
            `;

            return;
        }

        results.forEach(file => {
            createFileItem(file);
        });

        return;
    }


    /* =========================
       DOSSIERS
    ========================= */

    const folders = new Set();

    libraryData.files.forEach(file => {

        const folder = file.folder || "";

        if (!folder.startsWith(currentFolder)) {
            return;
        }

        const remaining =
            currentFolder
                ? folder
                    .replace(currentFolder, "")
                    .replace(/^\/+/, "")
                : folder;

        if (!remaining) return;

        const nextFolder =
            remaining.split("/")[0];

        const fullPath =
            currentFolder
                ? currentFolder + "/" + nextFolder
                : nextFolder;

        folders.add(fullPath);
    });


    folders.forEach(folder => {

        const name =
            folder.split("/").pop();

        const div =
            document.createElement("div");

        div.className = "item";

        div.innerHTML = `
            <div class="icon">📁</div>
            <div class="name">
                ${escapeHTML(name)}
            </div>
            <div class="info">
                Dossier
            </div>
        `;

        div.onclick = () => {

            currentFolder = folder;

            renderLibrary();
        };

        items.appendChild(div);
    });


    /* =========================
       FICHIERS
    ========================= */

    const files =
        libraryData.files.filter(file =>
            (file.folder || "") === currentFolder
        );

    files.forEach(file => {
        createFileItem(file);
    });


    if (
        folders.size === 0 &&
        files.length === 0
    ) {

        items.innerHTML = `
            <div class="empty">
                Ce dossier est vide.
            </div>
        `;
    }
}


/* =========================
   CRÉER FICHIER
========================= */

function createFileItem(file) {

    const div =
        document.createElement("div");

    div.className = "item";

    div.innerHTML = `
        <div class="icon">
            ${getIcon(file.type)}
        </div>

        <div class="name">
            ${escapeHTML(file.name)}
        </div>

        <div class="info">
            ${formatSize(file.size)}
        </div>
    `;

    div.onclick = () => {
        openFile(file);
    };

    items.appendChild(div);
}


/* =========================
   OUVRIR FICHIER
========================= */

async function openFile(file) {

    closeAllPlayers();

    viewerTitle.textContent = file.name;

    viewer.style.display = "block";

    document.body.style.overflow = "hidden";

    const url = getURL(file);


    /* PDF */

    if (file.type === "pdf") {

        pdfViewer.style.display = "flex";

        await openPDF(url);

        return;
    }


    /* IMAGE */

    if (file.type === "image") {

        imageViewer.style.display = "flex";

        imageElement.src = url;

        return;
    }


    /* AUDIO */

    if (file.type === "audio") {

        audioViewer.style.display = "block";

        audioTitle.textContent =
            file.name;

        audioElement.src = url;

        return;
    }


    /* VIDEO */

    if (file.type === "video") {

        videoViewer.style.display = "flex";

        videoElement.src = url;

        return;
    }


    /* AUTRES */

    otherViewer.style.display = "block";
}


/* =========================
   FERMER LES LECTEURS
========================= */

function closeAllPlayers() {

    imageViewer.style.display = "none";
    audioViewer.style.display = "none";
    videoViewer.style.display = "none";
    pdfViewer.style.display = "none";
    otherViewer.style.display = "none";

    imageElement.src = "";

    audioElement.pause();
    audioElement.removeAttribute("src");
    audioElement.load();

    videoElement.pause();
    videoElement.removeAttribute("src");
    videoElement.load();
}


window.closeViewer = function() {

    closeAllPlayers();

    viewer.style.display = "none";

    document.body.style.overflow = "";

    currentPDF = null;
};


/* =========================
   PDF.JS
========================= */

async function openPDF(url) {

    try {

        showLoading("Chargement du PDF...");

        currentPDF = await pdfjsLib.getDocument({
            url: url
        }).promise;

        currentPDFPage = 1;

        currentPDFScale = 1;

        await renderPDFPage(currentPDFPage);

        hideLoading();

    } catch (error) {

        hideLoading();

        console.error(error);

        pdfViewer.innerHTML = `
            <div style="
                padding:30px;
                text-align:center;
                color:white;
                margin:auto;
            ">
                <h2>Impossible d'afficher ce PDF</h2>

                <p>
                    Le lecteur PDF n'a pas pu charger
                    le fichier.
                </p>
            </div>
        `;
    }
}


/* =========================
   RENDRE PAGE PDF
========================= */

async function renderPDFPage(pageNumber) {

    if (!currentPDF) return;

    if (currentPDFRendering) {

        currentPDFPendingPage =
            pageNumber;

        return;
    }

    currentPDFRendering = true;

    try {

        const page =
            await currentPDF.getPage(pageNumber);


        /*
         * Largeur disponible.
         * Le PDF s'adapte automatiquement
         * à l'écran.
         */

        const availableWidth =
            Math.max(
                pdfArea.clientWidth - 30,
                250
            );


        const baseViewport =
            page.getViewport({
                scale: 1
            });


        let scale =
            availableWidth /
            baseViewport.width;


        scale =
            scale * currentPDFScale;


        /*
         * Sur ordinateur, éviter une page
         * excessivement petite.
         */

        if (window.innerWidth > 700) {

            scale =
                Math.max(scale, .8);
        }


        const viewport =
            page.getViewport({
                scale: scale
            });


        const outputScale =
            window.devicePixelRatio || 1;


        pdfCanvas.width =
            Math.floor(
                viewport.width *
                outputScale
            );

        pdfCanvas.height =
            Math.floor(
                viewport.height *
                outputScale
            );


        pdfCanvas.style.width =
            Math.floor(viewport.width) +
            "px";

        pdfCanvas.style.height =
            Math.floor(viewport.height) +
            "px";


        const context =
            pdfCanvas.getContext("2d");


        const renderContext = {

            canvasContext: context,

            viewport: viewport,

            transform:
                outputScale !== 1
                    ? [
                        outputScale,
                        0,
                        0,
                        outputScale,
                        0,
                        0
                    ]
                    : null
        };


        await page.render(
            renderContext
        ).promise;


        pdfPageInfo.textContent =
            "Page " +
            pageNumber +
            " / " +
            currentPDF.numPages;


        pdfArea.scrollTop = 0;

        pdfArea.scrollLeft = 0;


    } finally {

        currentPDFRendering = false;

        if (currentPDFPendingPage !== null) {

            const next =
                currentPDFPendingPage;

            currentPDFPendingPage = null;

            renderPDFPage(next);
        }
    }
}


/* =========================
   PDF NAVIGATION
========================= */

window.previousPage = function() {

    if (!currentPDF) return;

    if (currentPDFPage <= 1) return;

    currentPDFPage--;

    renderPDFPage(
        currentPDFPage
    );
};


window.nextPage = function() {

    if (!currentPDF) return;

    if (
        currentPDFPage >=
        currentPDF.numPages
    ) {
        return;
    }

    currentPDFPage++;

    renderPDFPage(
        currentPDFPage
    );
};


/* =========================
   PDF ZOOM
========================= */

window.zoomIn = function() {

    if (!currentPDF) return;

    currentPDFScale += .15;

    renderPDFPage(
        currentPDFPage
    );
};


window.zoomOut = function() {

    if (!currentPDF) return;

    currentPDFScale =
        Math.max(
            .55,
            currentPDFScale - .15
        );

    renderPDFPage(
        currentPDFPage
    );
};


window.fitWidth = function() {

    if (!currentPDF) return;

    currentPDFScale = 1;

    renderPDFPage(
        currentPDFPage
    );
};


/* =========================
   RETOUR
========================= */

backButton.onclick = () => {

    if (!currentFolder) return;

    const parts =
        currentFolder.split("/");

    parts.pop();

    currentFolder =
        parts.join("/");

    renderLibrary();
};


/* =========================
   RECHERCHE
========================= */

search.addEventListener(
    "input",
    () => {

        searchText =
            search.value;

        renderLibrary();
    }
);


/* =========================
   CLAVIER
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            viewer.style.display !== "block"
        ) {
            return;
        }

        if (event.key === "Escape") {
            closeViewer();
        }

        if (
            event.key === "ArrowLeft" &&
            currentPDF
        ) {
            previousPage();
        }

        if (
            event.key === "ArrowRight" &&
            currentPDF
        ) {
            nextPage();
        }
    }
);


/* =========================
   EMPÊCHER LE MENU CONTEXTUEL
========================= */

document.addEventListener(
    "contextmenu",
    event => {

        if (
            viewer.style.display === "block"
        ) {
            event.preventDefault();
        }
    }
);


/* =========================
   DÉMARRAGE
========================= */

loadLibrary();

</script>

</body>
</html>
